<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이안블루 | 공식 홈페이지</title>
	<link rel="stylesheet" href="style.css">
    <style>
        /* 메인 배너 (인트로) */
        .hero { position: relative; height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; color: white; text-align: center; overflow: hidden; background-color: #000; padding: 0 20px; }
        .hero-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.1); z-index: 1; pointer-events: none; }
        .hero-content { position: relative; z-index: 2; width: 100%; }
        .hero h1 { font-size: 46px; margin-bottom: 15px; font-weight: 700; text-shadow: 0 2px 15px rgba(0,0,0,0.8); word-break: keep-all; line-height: 1.3; }
        .hero p { font-size: 20px; opacity: 0.9; font-weight: 300; text-shadow: 0 2px 15px rgba(0,0,0,0.8); word-break: keep-all; }

    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="hero" id="main-hero-section">
        <video class="hero-video" autoplay loop muted playsinline>
            <source src="autumn2.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>지속 가능한 미래를 밝힙니다</h1>
            <p>최고의 에너지 효율화 기술 최첨단 스마트 조명 솔루션을 만나보세요.</p>
        </div>
    </section>

    <footer>

            <a href="#">이용약관</a>
            <a href="#">이메일무단수집거부</a>
            <a href="#">사이트맵</a>
        </div>
        <div class="footer-info">
            <p><strong>(주)이안블루</strong></p>
            <p>서울특별시 강북구 솔샘로 316 | Tel 02-987-6114 | Fax 02-981-7114</p>
            <p>COPYRIGHT © 2026 EANBLUE. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script src="script.js"></script>
	<script src="header.js"></script>
</body>
</html>
